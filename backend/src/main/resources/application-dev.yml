spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:petcare_db}
    username: ${POSTGRES_USER:petcare}
    password: ${POSTGRES_PASSWORD:petcare123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

aws:
  endpoint: ${AWS_ENDPOINT:}

logging:
  level:
    com.petcare.api: INFO
